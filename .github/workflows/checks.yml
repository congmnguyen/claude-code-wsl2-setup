name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # jq, shellcheck, and PowerShell 7 (pwsh) come with the runner image.
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Check docs and scripts
        env:
          CHECKS_REQUIRE_ALL: '1'
        run: bash scripts/check.sh
