name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Check docs and scripts
        run: bash scripts/check.sh
